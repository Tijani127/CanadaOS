name: build-canadaos-iso

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    container:
      # Build on actual Debian (trixie base since 1.1) so live-build behaves:
      # no foreign-distro parent-mirror gymnastics, no Ubuntu host detection.
      image: debian:trixie
      options: --privileged
    timeout-minutes: 120
    steps:
      - name: Prepare container (root, no sudo needed)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates xz-utils \
            live-build debootstrap debian-archive-keyring

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the CanadaOS ISO (live-build, Debian trixie)
        run: bash ./scripts/build-iso.sh
        timeout-minutes: 100

      - name: Name the artifact nicely
        run: |
          mkdir -p dist
          ISO=$(ls build/*.iso | head -n1)
          cp "$ISO" dist/canadaos-1.0-amd64.iso
          sha256sum dist/canadaos-1.0-amd64.iso > dist/canadaos-1.0-amd64.iso.sha256
          ls -la dist/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: canadaos-1.0-amd64-iso
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Boot smoke test (60 s, headless)
        run: |
          apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
          # This may exit non-zero simply because a live ISO never powers off;
          # what we care about is that the bootloader lives and the kernel
          # starts. SCM-stamped by the politeness protocol of Canada.
          timeout 60 qemu-system-x86_64 \
            -m 2048 -nographic \
            -cdrom dist/canadaos-1.0-amd64.iso \
            -boot d -no-reboot || true
          echo "ISO built and boot-tested politely, eh."

      - name: Desktop smoke test — run the shell under Xvfb and screenshot it
        run: |
          apt-get install -y --no-install-recommends xvfb imagemagick dbus-x11 \
            python3 python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-4.0 \
            gir1.2-vte-3.91 gir1.2-webkit-6.0 \
            fonts-noto-color-emoji fonts-dejavu adwaita-icon-theme
          rm -rf /tmp/canada-smoke && mkdir -p /tmp/canada-smoke/dist
          cp -r shell /tmp/canada-smoke/shell
          bash -n build/config/includes.chroot/usr/local/bin/canadaos-install \
            || { echo "canadaos-install has syntax errors"; exit 1; }
          cd /tmp/canada-smoke
          export GSK_RENDERER=cairo
          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          sleep 2
          # App matrix: launch every app alone, screenshot, so app-level
          # crashes/appearance get caught without booting the ISO, eh.
          for APP in paint notepad files settings installer hockey browser terminal syrup sadly; do
            PYTHONPATH=/tmp/canada-smoke/shell CANADAOS_FORCE_DEV=1 \
              CANADAOS_SMOKE_APP=$APP DISPLAY=:99 \
              python3 -m canadaos.main > "smoke-$APP.log" 2>&1 &
            APP_PID=$!
            sleep 5
            import -display :99 -window root "dist/app-$APP.png" || true
            kill $APP_PID 2>/dev/null || true
            sleep 1
          done
          # Maximize probe: windows must stay on-screen when maximized.
          PYTHONPATH=/tmp/canada-smoke/shell CANADAOS_SMOKE=1 CANADAOS_MAX=1 \
            DISPLAY=:99 python3 -m canadaos.main > smoke-max.log 2>&1 &
          APP_PID=$!
          sleep 8
          import -display :99 -window root dist/app-maximized.png || true
          kill $APP_PID 2>/dev/null || true
          kill $XVFB_PID 2>/dev/null || true
          echo "---- smoke logs ----"
          grep -l . smoke-*.log | xargs -I{} sh -c 'echo "== {} =="; cat {}' || true
          ls -la dist/
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp dist/*.png "$GITHUB_WORKSPACE/dist/"

      - name: Upload desktop screenshots
        uses: actions/upload-artifact@v4
        with:
          name: canadaos-desktop-screenshot
          path: "dist/*.png"
          retention-days: 14
          if-no-files-found: warn
