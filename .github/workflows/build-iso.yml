name: build-canadaos-iso

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    container:
      # Build on actual Debian so live-build behaves: no foreign-distro
      # parent-mirror gymnastics, no Ubuntu host detection, no drama, eh.
      image: debian:bookworm
      options: --privileged
    timeout-minutes: 120
    steps:
      - name: Prepare container (root, no sudo needed)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates xz-utils \
            live-build debootstrap debian-archive-keyring

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the CanadaOS ISO (live-build, Debian bookworm)
        run: bash ./scripts/build-iso.sh
        timeout-minutes: 100

      - name: Name the artifact nicely
        run: |
          mkdir -p dist
          ISO=$(ls build/*.iso | head -n1)
          cp "$ISO" dist/canadaos-1.0-amd64.iso
          sha256sum dist/canadaos-1.0-amd64.iso > dist/canadaos-1.0-amd64.iso.sha256
          ls -la dist/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: canadaos-1.0-amd64-iso
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Boot smoke test (60 s, headless)
        run: |
          apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
          # This may exit non-zero simply because a live ISO never powers off;
          # what we care about is that the bootloader lives and the kernel
          # starts. SCM-stamped by the politeness protocol of Canada.
          timeout 60 qemu-system-x86_64 \
            -m 2048 -nographic \
            -cdrom dist/canadaos-1.0-amd64.iso \
            -boot d -no-reboot || true
          echo "ISO built and boot-tested politely, eh."

      - name: Desktop smoke test — run the shell under Xvfb and screenshot it
        run: |
          apt-get install -y --no-install-recommends xvfb imagemagick
          rm -rf /tmp/canada-smoke && mkdir -p /tmp/canada-smoke && cp -r shell /tmp/canada-smoke/shell
          cd /tmp/canada-smoke
          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          sleep 2
          PYTHONPATH=/tmp/canada-smoke/shell CANADAOS_SMOKE=1 DISPLAY=:99 \
            timeout 14 python3 -m canadaos.main > smoke-shell.log 2>&1 || true
          import -display :99 -window root dist/desktop-screenshot.png || true
          kill $XVFB_PID 2>/dev/null || true
          echo "---- smoke shell log ----"
          cat smoke-shell.log || true
          ls -la dist/

      - name: Upload desktop screenshot
        uses: actions/upload-artifact@v4
        with:
          name: canadaos-desktop-screenshot
          path: dist/desktop-screenshot.png
          retention-days: 14
          if-no-files-found: warn
